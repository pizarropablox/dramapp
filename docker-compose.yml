services:
  postgres:
    image: postgres:17
    container_name: dramapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dramapp
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d dramapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
